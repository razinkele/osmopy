name: E2E

# Every browser test (tests/test_e2e_*.py), in a real browser against the running app. The unit
# suite cannot see what these see: Shiny's real rendering and reactivity, and the deck.gl maps.
# - Config integrity: viewing a tab, switching models or editing must leave the config exactly as
#   loaded or edited. Three releases in November 2026 fixed corruption of this kind that only a
#   browser run reproduced (#269, #271, #274).
# - Maps and results: grid maps and overlays, the map viewer and builder, live movement, spatial
#   results, and a Baltic run end to end. Until 2026-11-21 this job ran 4 of the 22 files and
#   none of these, so a shiny_deckgl bump was tested in CI without one map being drawn.
#
# Opt-in like visual.yml: PRs to master that touch the UI or the config pipeline, plus manual
# dispatch. ADVISORY -- do NOT add `browser-tests` to branch-protection required checks (a
# path-filtered job reports no status on unrelated PRs and would deadlock merges).
on:
  pull_request:
    branches: [master]
    paths:
      - "ui/**"
      - "app.py"
      - "osmose/config/**"
      - "osmose/schema/**"
      - "osmose/demo.py"
      - "tests/test_e2e_*.py"
      - "tests/_e2e_*.py"  # their helpers: _e2e_support, _e2e_feedback_env
      - "www/**"
      - ".github/workflows/e2e.yml"
      # A dependency bump (shiny, shiny_deckgl, ...) changes the rendered UI with no ui/ diff.
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    # All 22 files take about 22 minutes (measured 2026-11-21; test_e2e_config_reload.py alone
    # is about 10).
    timeout-minutes: 45
    # Same digest-pinned Playwright image as visual.yml; the version-assert step keeps the
    # [viztest] playwright pin and the image's bundled browsers in step.
    container: mcr.microsoft.com/playwright/python@sha256:678457c4c323b981d8b4befc57b95366bb1bb6aa30057b1269f6b171e8d9975a  # v1.58.0-noble
    steps:
      - uses: actions/checkout@v5
      - name: Trust the workspace (container runs as root vs checkout UID)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install package with the browser-test and numba extras
        # numba: some of these tests run the Python engine, as production does (numba is
        # installed there). Without it a 3-year Baltic run misses its 120 s budget
        # (test_e2e_live_movement.py); with it, on a cold cache and 4 cores, that test takes
        # about 14 s.
        run: pip install -e ".[viztest,numba]"
      - name: Assert playwright wheel matches the container image
        run: |
          python - <<'PY'
          import sys
          from importlib.metadata import version
          installed = version("playwright")
          expected = "1.58.0"  # must equal the image tag (v1.58.0-noble) above
          if installed != expected:
              sys.exit(f"playwright {installed} != image-pinned {expected}; bump the [viztest] pin, the digest, and this expected together")
          print("playwright", installed, "matches image")
          PY
      - name: Run every browser test (retry transient timeouts only)
        # The glob is the scope, so a new tests/test_e2e_*.py file runs here without being
        # listed, and there is no `-m e2e`: a file that forgot its marker would be silently
        # deselected by it. Not the whole suite: its other modules need [dev], not [viztest].
        # -o addopts="" drops the ini's `-m 'not e2e ...'` filter and `--dist loadfile`.
        run: >-
          python -m pytest
          tests/test_e2e_*.py
          -o addopts="" -ra --reruns 1 --only-rerun TimeoutError
