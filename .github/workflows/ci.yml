name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    # Single-version by design: ruff's behaviour is governed by `target-version`
    # in pyproject, not the runtime Python, so a version matrix adds no signal.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check osmose/ ui/ tests/

      - name: Ruff format check
        run: ruff format --check osmose/ ui/ tests/

  type-check:
    # Matrixed across the supported Python range. pyrightconfig.json pins
    # `pythonVersion: "3.12"` as the local default, so we pass --pythonversion
    # explicitly per leg — otherwise pyright would analyze every leg as 3.12 and
    # the 3.13 leg would be a no-op. The `test` job exercises 3.13 at runtime;
    # this leg is what type-checks the 3.13 path (stdlib stubs + version_info
    # narrowing). fail-fast off so both versions' errors surface in one run.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pyright --pythonversion ${{ matrix.python-version }}

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        # -n auto parallelizes across the runner's cores (pytest-xdist); --dist
        # loadfile (from pyproject addopts) keeps each file on one worker. Local
        # dev on a many-core box should use a bounded count (e.g. -n 12) rather
        # than auto — auto over-subscribes against the engine's numba parallel
        # kernels once worker count approaches the core count.
        run: pytest -n auto --cov=osmose --cov-report=term-missing --cov-report=html --cov-fail-under=90

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: htmlcov/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Docker build smoke test
        run: docker build -t osmose-test .
      - name: Docker run smoke test (catch runtime crash-loops a build can't)
        run: |
          docker run -d --name osmose-run -p 8000:8000 osmose-test
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/ >/dev/null 2>&1; then
              echo "App responded on attempt $i"; ok=1; break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' osmose-run 2>/dev/null)" != "true" ]; then
              echo "Container exited early (crash-loop) — logs:"; docker logs osmose-run; exit 1
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "App did not respond within timeout — logs:"; docker logs osmose-run; exit 1
          fi
          docker rm -f osmose-run

  test-no-numba:
    # Exercise the pure-Python engine fallbacks (osmose/engine/processes/
    # {mortality,predation,movement}.py) that the main test job never hits
    # because numba is always installed there. General engine tests below run a
    # full simulation step, so with numba absent they transparently use the
    # _HAS_NUMBA == False path. (numba-specific tests skipif themselves out
    # without numba, so they are deliberately NOT in this subset.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Uninstall numba (force pure-Python fallback)
        run: pip uninstall -y numba

      - name: Assert numba is absent
        run: python -c "import importlib.util, sys; sys.exit(0 if importlib.util.find_spec('numba') is None else 1)"

      - name: Run engine subset on the pure-Python path
        run: |
          pytest -p no:cacheprovider -q \
            tests/test_engine_mortality_loop.py \
            tests/test_engine_mortality.py \
            tests/test_engine_movement.py \
            tests/test_engine_map_movement.py \
            tests/test_engine_diet.py \
            tests/test_engine_natural.py

  apptainer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2
      - name: Build the HPC image
        run: apptainer build --fakeroot osmose.sif apptainer/osmose.def
      - name: Smoke — CLI + engine import + numba cache + java
        run: |
          apptainer exec osmose.sif osmose --help
          apptainer exec osmose.sif python -c "import osmose.engine"
          apptainer exec osmose.sif java -version
          apptainer exec osmose.sif sh -c 'ls -A "$NUMBA_CACHE_DIR" | grep -q . && echo numba-cache-baked'
      - name: Smoke — tiny sweep into a writable bind mount
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          apptainer exec -B "$RUNNER_TEMP/results:/results" osmose.sif \
            python /app/scripts/compute_model_reference_points.py \
            --config /app/data/examples/osm_all-parameters.csv \
            --grid 0 0.5 --n-years 3 --replicates 1 --workers 1 --out /results/rp.json
          test -f "$RUNNER_TEMP/results/rp.json" && echo sweep-wrote-to-bind-mount
