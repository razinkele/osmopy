name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    # Single-version by design: ruff's behaviour is governed by `target-version`
    # in pyproject, not the runtime Python, so a version matrix adds no signal.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check osmose/ ui/ tests/

      - name: Ruff format check
        run: ruff format --check osmose/ ui/ tests/

  type-check:
    # Matrixed across the supported Python range. pyrightconfig.json pins
    # `pythonVersion: "3.12"` as the local default, so we pass --pythonversion
    # explicitly per leg — otherwise pyright would analyze every leg as 3.12 and
    # the 3.13 leg would be a no-op. The `test` job exercises 3.13 at runtime;
    # this leg is what type-checks the 3.13 path (stdlib stubs + version_info
    # narrowing). fail-fast off so both versions' errors surface in one run.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pyright --pythonversion ${{ matrix.python-version }}

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        # -n auto parallelizes across the runner's cores (pytest-xdist); --dist
        # loadfile (from pyproject addopts) keeps each file on one worker. Local
        # dev on a many-core box should use a bounded count (e.g. -n 12) rather
        # than auto — auto over-subscribes against the engine's numba parallel
        # kernels once worker count approaches the core count.
        run: pytest -n auto --cov=osmose --cov-report=term-missing --cov-report=html --cov-fail-under=90

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: htmlcov/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Docker build smoke test
        run: docker build -t osmose-test .
