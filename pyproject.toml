[project]
name = "osmose-python"
dynamic = ["version"]
description = "Python orchestration layer and Shiny web interface for the OSMOSE marine ecosystem simulator"
requires-python = ">=3.12"
dependencies = [
    "shiny>=1.3.0",
    "shinyswatch>=0.7.0",
    "shinywidgets>=0.3",
    "pandas>=2.2",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "plotly>=5.18",
    "jinja2>=3.1",
    "pymoo>=0.6",
    "scikit-learn>=1.4",
    "SALib>=1.5",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "shiny_deckgl @ git+https://github.com/razinkele/shiny_deckgl.git@v1.6.1",
]

[project.optional-dependencies]
numba = ["numba>=0.60"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "pre-commit>=3.5",
    "pyright>=1.1.350",
    # numba is also an end-user opt-in via [numba], but dev/CI always
    # gets it because the test suite (test_tutorial_3species.py and
    # several engine tests) runs full simulations that are 5-10x slower
    # without the JIT path. CI without numba pushes the full suite past
    # 30 min; with numba it completes in a few minutes.
    "numba>=0.60",
]

[project.scripts]
osmose = "osmose.cli:main"

[tool.setuptools.dynamic]
version = {attr = "osmose.__version__.__version__"}

[tool.setuptools.packages.find]
include = ["osmose*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["e2e: end-to-end browser tests (Playwright)"]
addopts = "-m 'not e2e'"

[tool.coverage.run]
omit = [
    # Dual-implementation JIT modules: the numba @njit bodies compile to machine
    # code that coverage.py cannot line-trace, and the parallel pure-Python
    # fallbacks only execute when numba is absent. With numba installed (dev/CI),
    # neither path is fully measurable, so counting these in the line-coverage
    # gate is misleading rather than informative.
    "osmose/engine/processes/mortality.py",
    "osmose/engine/processes/predation.py",
    "osmose/engine/processes/movement.py",
]

[tool.ruff]
target-version = "py312"
line-length = 100
