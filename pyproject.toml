[project]
name = "osmose-python"
dynamic = ["version"]
description = "Python orchestration layer and Shiny web interface for the OSMOSE marine ecosystem simulator"
requires-python = ">=3.12"
dependencies = [
    # shiny 1.6.x is the supported baseline. shinyswatch serves its PRECOMPILED theme
    # (no sass/libsass needed) only when its bundled Bootstrap matches shiny's: shiny 1.6.3
    # ships Bootstrap 5.3.8 and shinyswatch >=0.11 bundles 5.3.8 (older shinyswatch bundles
    # 5.3.1 -> mismatch -> falls back to a libsass compile). osmose uses the unmodified
    # superhero theme, so the precompiled path applies -- do not add libsass.
    "shiny>=1.6.3,<1.7",
    "shinyswatch>=0.11",
    "shinywidgets>=0.7",
    "pandas>=2.2",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "plotly>=5.18",
    "jinja2>=3.1",
    "pymoo>=0.6",
    "scikit-learn>=1.4",
    "SALib>=1.5",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "scipy>=1.13",
    # cma is imported directly by osmose/calibration/cmaes_runner.py but is only pulled
    # transitively via pymoo, so its version drifts. cma <=3.3.0 uses numpy-2-removed APIs
    # (e.g. np.Inf) and breaks cma.CMAEvolutionStrategy under numpy>=2 (fixed in 3.4.0);
    # floor at the current major.
    "cma>=4.0",
    "shiny_deckgl @ git+https://github.com/razinkele/shiny_deckgl.git@v1.9.2",
    "pyvis @ git+https://github.com/razinkele/pyvis.git@v4.2",
    "pyarrow>=14",
]

[project.optional-dependencies]
numba = ["numba>=0.60"]
docs = ["sphinx>=8", "myst-parser>=4", "furo>=2024.1"]
# GeoTIFF I/O for the EMODnet fine-grid bathymetry fetch (scripts/build_baltic_fine_grid.py).
# Kept out of [dev]: the pure shallow-fraction core (osmose/forcing/bathymetry.py) that IS
# unit-tested has no rasterio dependency, and the network-fetch script itself is not
# unit-tested -- only opt in when actually building the fine grid.
forcing = ["rasterio>=1.3"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "hypothesis>=6.100",
    # ruff is pinned to a MINOR range, not floated. 0.16.0 expanded the default
    # rule set far beyond the historical E4/E7/E9/F; because the floor was an
    # open `>=0.3`, that expansion landed silently and reddened CI on a clean
    # tree (721 findings, none of them regressions). The extended set was
    # adopted deliberately on 2026-09-12 -- see [tool.ruff.lint] below. Keep the
    # upper bound: when 0.17 expands the defaults again, that should be a
    # decision, not a surprise on an unrelated PR.
    "ruff>=0.16,<0.17",
    "pre-commit>=3.5",
    "pyright>=1.1.350",
    # starlette.testclient (used by tests/test_feedback_api.py to exercise the
    # token-gated /api/feedback endpoint) requires httpx. starlette ships with
    # shiny but does NOT pull httpx, so a clean [dev] install errors at collection
    # without this -- it was only passing locally via a transitive copy. Keep the
    # security-endpoint tests running in CI rather than skipping them.
    "httpx>=0.27",
    # Pillow: used by the pure image-diff core (tests/_visual_compare.py) that the
    # compare_images unit tests (tests/test_visual_compare.py) exercise in the normal
    # suite. Declaring it in [dev] (not only [viztest]) keeps those tests running in
    # standard CI rather than relying on transitive presence (clean-venv false-green trap).
    "pillow>=10",
    # numba is also an end-user opt-in via [numba], but dev/CI always
    # gets it because the test suite (test_tutorial_3species.py and
    # several engine tests) runs full simulations that are 5-10x slower
    # without the JIT path. CI without numba pushes the full suite past
    # 30 min; with numba it completes in a few minutes.
    "numba>=0.60",
    # dynesty backs the nested-sampling path in osmose/calibration/uq/. Like numba
    # above it is an end-user opt-in (via [uq]), but dev/CI must have it: the 33
    # tests in test_uq_sampler.py / test_uq_run.py / test_uq_growth.py exercise it
    # directly and FAIL (not skip) without it -- ModuleNotFoundError raised from a
    # deferred import inside sampler.py, so collection succeeds and the failure
    # only shows at run time. That is the same clean-venv false-green trap the
    # pillow and httpx entries above document.
    "dynesty>=3.1",
]
viztest = [
    # Visual-regression browser tests (pytest -m visual). playwright is PINNED to match the
    # Playwright container image digest in .github/workflows/visual.yml (the version-assert step
    # enforces it) -- an unpinned spec lets pip upgrade past the image's bundled browsers. Kept
    # OUT of [dev] so the normal CI legs stay playwright-free.
    "playwright==1.58.0",
    "pytest-playwright>=0.5",
    "pillow>=10",
    # Retry transient TimeoutError (cold container app-start) without retrying a real
    # AssertionError visual regression -- keeps flake-red distinct from regression-red.
    "pytest-rerunfailures>=14",
]
uq = ["dynesty>=3.1"]

[project.urls]
Documentation = "https://razinkele.github.io/osmopy/"
Repository = "https://github.com/razinkele/osmopy"

[project.scripts]
osmose = "osmose.cli:main"

[tool.setuptools.dynamic]
version = {attr = "osmose.__version__.__version__"}

[tool.setuptools.packages.find]
include = ["osmose*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end browser tests (Playwright)",
    "visual: screenshot visual-regression tests (Playwright; opt-in, run with -m visual)",
    # NOT excluded by addopts below -- a `slow`-marked test still runs in a bare
    # `pytest` and in CI (addopts only filters e2e/visual). This marker documents
    # intent, it does not gate execution. For a test that must not run without
    # explicit opt-in, also gate it on an env var: see OSMOSE_JAR
    # (tests/test_egg_retention_java_parity.py) or OSMOSE_BIOEN_WHOLE_RUN_SMOKE
    # (tests/test_engine_bioen_numba_kernel.py) for the pattern.
    "slow: long-running tests incl. the Java cross-check (marker only -- see comment above)",
    "integration: exercises a real engine run in-process (marker only -- not deselected below)",
]
# --dist loadfile: when run in parallel (-n N), keep each file's tests on one
# worker. Preserves implicit intra-file ordering (e.g. module-level cache state)
# and avoids redundantly rebuilding module/session-scoped fixtures across
# workers. No-op on serial runs. Pass -n auto (or a worker count) to parallelize.
# -ra: print the reason for every non-passing outcome (skip/xfail/etc.) in the
# final summary. Without it, a skipif-gated test just adds to the "N skipped"
# count with no indication of WHICH test or WHY -- verified empirically:
# a bare `pytest` run shows only "1 skipped in 0.12s" for a skipif'd test,
# `-ra` adds a "short test summary info" line naming the test and its reason.
addopts = "-m 'not e2e and not visual' --dist loadfile -ra"

[tool.coverage.run]
omit = [
    # Dual-implementation JIT modules: the numba @njit bodies compile to machine
    # code that coverage.py cannot line-trace, and the parallel pure-Python
    # fallbacks only execute when numba is absent. With numba installed (dev/CI),
    # neither path is fully measurable, so counting these in the line-coverage
    # gate is misleading rather than informative.
    "osmose/engine/processes/mortality.py",
    "osmose/engine/processes/predation.py",
    "osmose/engine/processes/movement.py",
    # Jinja renders osmose/templates/report.html by compiling it to Python whose
    # co_filename is the template path under this source tree, so coverage traces it
    # as a measured "osmose" file. The HTML report then feeds the raw template (CSS/HTML)
    # to ast.parse (find_soft_key_lines) and crashes with SyntaxError. Templates are not
    # Python source — exclude them from measurement entirely.
    "osmose/templates/*",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Adopted 2026-09-12: ruff 0.16's extended default rule set, rather than the
# historical E4/E7/E9/F. 370 findings were auto-fixed and the rest triaged by
# hand; the ignores below are the rules that are wrong for THIS codebase, each
# with its reason. Everything not listed here is enforced.
ignore = [
    # Broad `except Exception` is a deliberate pattern here, not an oversight:
    # Shiny render/effect callbacks must never propagate an exception into the
    # reactive graph (it kills the session), and the engine's optional-feature
    # probes fall back rather than fail. Narrowing them individually would mean
    # enumerating every exception a third-party plotting/IO stack can raise.
    "BLE001",
    # try/except/pass and try/except/continue are used for genuinely optional
    # work (best-effort cleanup, probing a capability, skipping an unreadable
    # entry mid-scan). The bare form is the intent.
    "S110",
    "S112",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately do things production code should not.
"tests/*" = [
    "S101",    # assert IS the point
    "S102",    # exec: test_docs_build executes doc snippets on purpose
    "PLW1510", # subprocess check=: tests assert on returncode themselves
]
"scripts/*" = [
    "PLW1510", # these drive external engines and inspect returncode directly
    # EXE001 wants a shebang file to be chmod +x. Do NOT satisfy it here: these
    # scripts import numpy/numba/xarray and are documented (CLAUDE.md) to run as
    # `.venv/bin/python scripts/foo.py`. Marking them executable would invite
    # `./scripts/foo.py`, which dispatches to `#!/usr/bin/env python3` -> system
    # python -> ImportError. The shebang is vestigial; the ignore is the honest
    # option until someone strips the 52 shebang lines.
    "EXE001",
]
